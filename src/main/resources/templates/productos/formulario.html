<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo producto</title>
</head>
<body>
    <h1 th:text="${nombreProyecto}">Catalogo de productos</h1>
    <h2>Registrar producto</h2>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>

        <label for="precio">Precio:</label>
        <input id="precio" type="number" step="0.01" th:field="*{precio}" required>

        <label for="categoria">Categoria:</label>
        <input id="categoria" type="text" th:field="*{categoria}" required>

        <button type="submit">Guardar</button>
    </form>

    <p><a th:href="@{/productos}">Volver a la lista</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del producto</title>
</head>
<body>
    <h1 th:text="${nombreProyecto}">Catalogo de productos</h1>
    <h2>Detalle del producto</h2>

    <p>ID: <span th:text="${producto.id}"></span></p>
    <p>Nombre: <span th:text="${producto.nombre}"></span></p>
    <p>Precio: <span th:text="${producto.precio}"></span></p>
    <p>Categoria: <span th:text="${producto.categoria}"></span></p>

    <a th:href="@{/productos}">Volver a la lista</a>
</body>
</html>
